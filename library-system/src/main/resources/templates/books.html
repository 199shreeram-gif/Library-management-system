<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Central Library</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Book Catalog</h2>
        <div>
            <a th:if="${isAdmin}" th:href="@{/books/add}" class="btn btn-primary me-2">+ Add Book</a>
            <a th:href="@{/my-books}" class="btn btn-info text-white">📖 My Books</a>
        </div>
    </div>

    <form th:action="@{/books}" method="get" class="mb-4">
        <div class="input-group shadow-sm">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by Book Title or ISBN..." required>
            <button class="btn btn-primary" type="submit">Search</button>
            <a th:href="@{/books}" class="btn btn-outline-danger">Clear</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>ISBN</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="4" class="text-center py-4 text-muted">No books found matching your search.</td>
                </tr>
                <tr th:each="book : ${books}">
                    <td class="align-middle fw-bold" th:text="${book.title}">Title</td>
                    <td class="align-middle text-muted" th:text="${book.isbn}">ISBN</td>
                    <td class="align-middle">
                        <span th:if="${book.quantity > 0}" class="badge bg-success" th:text="'In Stock: ' + ${book.quantity}"></span>
                        <span th:if="${book.quantity <= 0}" class="badge bg-danger">Out of Stock</span>
                    </td>
                    <td class="align-middle">
                        <form th:action="@{/books/issue/{id}(id=${book.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-primary" th:disabled="${book.quantity <= 0}">Borrow</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
