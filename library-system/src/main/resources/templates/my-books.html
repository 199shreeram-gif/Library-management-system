<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">My Borrowed Books</span>
        <a th:href="@{/books}" class="btn btn-outline-light btn-sm">← Back to Catalog</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Book Title</th>
                    <th>Borrowed On</th>
                    <th>Due Date</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(records)}">
                    <td colspan="4" class="text-center py-4 text-muted">You have no borrowed books.</td>
                </tr>
                <tr th:each="record : ${records}">
                    <td class="align-middle fw-bold" th:text="${record.book.title}">Title</td>
                    <td class="align-middle" th:text="${record.issueDate}">Date</td>
                    <td class="align-middle text-danger fw-bold" th:text="${record.returnDate}">Due Date</td>
                    <td class="align-middle">
                        <form th:action="@{/books/return/{id}(id=${record.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-success">Return Book</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
