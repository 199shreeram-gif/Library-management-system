<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Add New Book</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/books/add}" th:object="${book}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Book Title</label>
                            <input type="text" th:field="*{title}" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ISBN</label>
                            <input type="text" th:field="*{isbn}" class="form-control" required/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Quantity</label>
                            <input type="number" th:field="*{quantity}" class="form-control" required/>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Book</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
